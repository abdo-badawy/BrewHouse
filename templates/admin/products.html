{% extends "admin/base.html" %}{% block content %}<h1>Products</h1><p><a class="btn" href="{{ url_for('admin_add_product') }}">Add product</a></p>
<div class="scroll"><table><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody>
{% for p in products %}<tr><td>{{ p.name }}</td><td>{{ p.category.name }}</td><td>{{ '%.2f'|format(p.price) }}</td><td>{{ 'Available' if p.is_available else 'Unavailable' }}</td>
<td class="acts"><a class="btn sm" href="{{ url_for('admin_edit_product', pid=p.id) }}">Edit</a>
<form method="post" action="{{ url_for('admin_delete_product', pid=p.id) }}" data-confirm="Delete {{ p.name }}? This cannot be undone."><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn sm danger">Delete</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
